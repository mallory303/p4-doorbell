<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         font: 500 14px/1.4 sans-serif; color: #ddd; }
  #wrap { display: flex; align-items: center; gap: 10px; }
  #dot { width: 12px; height: 12px; border-radius: 50%; background: #555;
         transition: background .2s; }
  #dot.live { background: #ff5252; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
</style>
</head>
<body>
<div id="wrap"><div id="dot"></div><span id="lbl">waiting for answer…</span></div>
<script>
(function () {
  "use strict";

  // ---- locate the P4 host: query param, else same host as HA ----
  var params = new URLSearchParams(location.search);
  var P4 = params.get("p4") || "";
  var dot = document.getElementById("dot");
  var lbl = document.getElementById("lbl");

  function parentHass() {
    try {
      var ha = window.parent.document.querySelector("home-assistant");
      if (ha && ha.hass) return ha.hass;
      var main = window.parent.document.querySelector("home-assistant-main");
      if (main && main.hass) return main.hass;
    } catch (e) {}
    return null;
  }

  function callState() {
    var hass = parentHass();
    if (!hass || !hass.states) return null;
    for (var id in hass.states) {
      if (id.indexOf("sensor.p4_doorbell_call_state") === 0 ||
          id.indexOf("call_state") > 0 && id.indexOf("p4_doorbell") >= 0) {
        return hass.states[id].state;
      }
    }
    return null;
  }

  // ---- mic -> PCM16@16k -> POST chunks to the P4 ----
  var ctx = null, stream = null, running = false;

  function start() {
    if (running || !P4) return;
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
    }).then(function (s) {
      stream = s;
      ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      var src = ctx.createMediaStreamSource(s);
      var proc = ctx.createScriptProcessor(4096, 1, 1);
      var buf = new Int16Array(0);
      proc.onaudioprocess = function (ev) {
        var inp = ev.inputBuffer.getChannelData(0);
        var merged = new Int16Array(buf.length + inp.length);
        merged.set(buf, 0);
        for (var i = 0; i < inp.length; i++) {
          var v = Math.max(-1, Math.min(1, inp[i]));
          merged[buf.length + i] = v < 0 ? v * 32768 : v * 32767;
        }
        // send in ~256 ms chunks (4096 samples @16k)
        if (merged.length >= 4096) {
          var chunk = merged.slice(0, 4096);
          buf = merged.slice(4096);
          fetch(P4 + "/api/play", {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/octet-stream" },
            body: chunk.buffer.slice(0)
          }).catch(function () {});
        } else {
          buf = merged;
        }
      };
      src.connect(proc);
      proc.connect(ctx.destination);
      running = true;
      dot.className = "live";
      lbl.textContent = "talking to the door…";
    }).catch(function (e) {
      lbl.textContent = "mic blocked: " + (e && e.name ? e.name : e);
    });
  }

  function stop() {
    if (!running) return;
    running = false;
    try { if (ctx) ctx.close(); } catch (e) {}
    try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    ctx = null; stream = null;
    dot.className = "";
    lbl.textContent = "waiting for answer…";
  }

  // poll call state (cheap, 1 Hz)
  setInterval(function () {
    var st = callState();
    if (st === "answered" || st === "module_active") start(); else stop();
  }, 1000);
})();
</script>
</body>
</html>
