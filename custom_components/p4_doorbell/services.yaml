answer:
  name: Answer
  description: Answer the doorbell call (from the popup or an automation).

end_call:
  name: End call
  description: End the current doorbell call and return to idle.

simulate_ring:
  name: Simulate ring
  description: Fire a doorbell ring event without the physical button (testing).

announce:
  name: Announce
  description: >-
    Speak the announce message (ElevenLabs) in the house on the chime
    players and on the doorbell speaker for the visitor. Defaults to the
    configured announce message text.
  fields:
    message:
      name: Message
      description: Optional override text; empty = the configured announce message.
      selector:
        text:
